version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: showme-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: showme_v2
      MYSQL_USER: showme
      MYSQL_PASSWORD: showme1234
    ports:
      - "3307:3306"
    volumes:
      - showme-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  showme-mysql-data:
